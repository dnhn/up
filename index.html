<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<title>uptime</title>
<meta name="description" content="personal uptime" />
<meta name="viewport" content="width=device-width" />

<style>
html { color-scheme: dark; font-family: monospace; }
#up { font-size: xxx-large; }
#at { font-size: xx-large; }
</style>

</head>

<body>

<main><div id="up"></div><time id="at"></time></main>

<script>
fetch('up.json')
  .then(function (response) { return response.json() })
  .then(function (data) {
    const at = new Date(data.at).toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' })
    const [seconds, minutes, h] = data.up.split(':').toReversed()
    const days = h > 24 ? Math.floor(h / 24) : undefined
    const hours = h > 24 ? h % 24 : h
    const up = new Intl.DurationFormat(undefined, { style: "narrow" }).format({ days, hours, minutes, seconds })

    document.getElementById('up').textContent = up
    document.getElementById('at').textContent = at
    document.getElementById('at').dateTime = data.at
  })
</script>

</body>
</html>
