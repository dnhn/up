<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8" />
<title>uptime</title>
<meta name="description" content="personal uptime" />
<meta name="viewport" content="width=device-width, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding:0; }
html { font-family: monospace; }
body { padding: 1rem; height: 100svh; }
main {
  margin-inline: auto;
  display: flex;
  align-items: center;
  width: 8ch;
  height: 80svh;
  text-align: right;
  font-size: 15vw;
}
section { font-size: initial; }
.loading :where(#d, #hms, #at) { opacity: 0; }
#d { font-size: 10vw; transition: opacity 1s; }
#hms { font-size: 15vw; transition: opacity 1s ease-in; }
#at { margin-top: 2rem; display: block; transition: opacity 2s ease-in; }
</style>
<script src="/up.js" defer></script>
</head>
<body>
<main>
  <section>
    <div id="d"></div>
    <div id="hms"><span id="h">00</span>:<span id="m">00</span>:<span id="s">00</span></div>
    <time id="at"></time>
  </section>
</main>
</body>
</html>
