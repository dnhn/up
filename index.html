<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<title>uptime</title>
<meta name="description" content="personal uptime" />
<meta name="viewport" content="width=device-width" />

<style>
html { color-scheme: dark; font-family: monospace; }
#up { font-size: xxx-large; }
#at { font-size: xx-large; }
</style>

</head>

<body>

<main><div id="up"></div><time id="at"></time></main>

<script>
const $at = document.getElementById('at')
const $up = document.getElementById('up')

fetch('up.json')
  .then(function (response) { return response.json() })
  .then(function (data) {
    const at = new Date(data.at).toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' })

    $at.textContent = at
    $at.dateTime = data.at
    $up.textContent = format(data.up)
  })

function format(hms) {
  const [seconds, minutes, h] = hms.split(':').reverse()
  const days = Math.floor(h / 24)
  const hours = h % 24

  return new Intl.DurationFormat(undefined, { style: "narrow" }).format({ days, hours, minutes, seconds })
}
</script>

</body>
</html>
