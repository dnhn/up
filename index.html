<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<title>uptime</title>
<meta name="description" content="personal uptime" />
<meta name="viewport" content="width=device-width" />

<style>
html { color-scheme: dark; font-family: monospace; }
#up { font-size: xxx-large; }
#at { font-size: xx-large; }
</style>

</head>

<body>

<main><div id="up"></div><time id="at"></time></main>

<script>
const $at = document.getElementById('at')
const $up = document.getElementById('up')

fetch('up.json')
  .then(function (response) { return response.json() })
  .then(function (data) {
    const atDate = new Date(data.at)
    const at = atDate.toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' })

    $at.textContent = at
    $at.dateTime = data.at

    function update() {
      const elapsed = Math.round((new Date() - atDate) / 1000)
      const estimation = toHMS(toSeconds(data.up) + elapsed)

      $up.textContent = format(estimation)
    }

    update()
    setInterval(update, 1000)
  })

function toSeconds(hms) {
  const [s, m, h] = hms.split(':').map(Number).reverse()

  return s + (m * 60) + (h * 3600)
}

function toHMS(seconds) {
  const h = String(Math.floor(seconds / 3600)).padStart(2, '0')
  const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')
  const s = String(seconds % 60).padStart(2, '0')

  return `${h}:${m}:${s}`
}

function format(hms) {
  const [seconds, minutes, h] = hms.split(':').reverse()
  const days = Math.floor(h / 24)
  const hours = h % 24

  return new Intl.DurationFormat(undefined, { style: "narrow" }).format({ days, hours, minutes, seconds })
}
</script>

</body>
</html>
